<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Loop & array</h1>
    <script>
        var coworkers = ["egoing", "leezche","duru","taheo"];
        var len = coworkers.length
    </script>
    <h2>Co workers</h2>
    <ul>
        <script>
               var i = 0;
            while(i < len){
                document.write('<li><a href="http://a.com/' +coworkers[i]+'">' +coworkers[i] +'</li>')
                i = i + 1;
            }
        </script>
    
    </ul>
</body>
</html>
